<!doctype html><html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:800px; overflow:hidden;
    font-family:"Comic Sans MS","Comic Neue",cursive; }
  .stage {
    position:relative; width:1200px; height:800px;
    background:
      radial-gradient(120% 100% at 50% 30%, #2a005a 0%, #0a0030 48%, #000018 100%),
      url("__STARTILE__");
    background-size: cover, 128px 128px;
    overflow:hidden;
  }
  /* ambient screenshot of the real theme, dim, full-bleed behind */
  .shot{ position:absolute; right:-60px; bottom:-40px; width:760px; opacity:.32;
    transform:rotate(-7deg); transform-origin:bottom right;
    border:6px ridge #ff00ff; box-shadow:0 0 40px #00ffff; }
  .shot img{ display:block; width:100%; }
  .shot2{ position:absolute; left:-90px; top:-50px; width:520px; opacity:.16;
    transform:rotate(6deg); }
  .shot2 img{ display:block; width:100%; }
  .stage::after{ content:""; position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 2px,transparent 2px 4px);
    mix-blend-mode:multiply; }

  /* centered hero — safe against any store crop */
  .hero{ position:absolute; inset:0; z-index:3;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:0 130px; }

  .kicker{ color:#00ffff; font-size:24px; letter-spacing:7px; text-transform:uppercase;
    text-shadow:0 0 8px #00ffff,2px 2px 0 #ff00ff; margin-bottom:2px; }

  .wordwrap{ display:flex; align-items:center; gap:20px; }
  .flame{ width:44px; height:96px; background:url("__FIRE__") no-repeat center / contain;
    mix-blend-mode:screen; flex:0 0 auto; }
  .word{
    font-weight:700; line-height:.9; text-transform:uppercase;
    font-size:118px; letter-spacing:-2px;
    background:linear-gradient(#ffffff 0%, #ffe600 22%, #ff7b00 40%, #ff00c8 60%, #7a00ff 80%, #00e0ff 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    -webkit-text-stroke:3px #10002a;
    filter:drop-shadow(4px 4px 0 #000) drop-shadow(0 0 22px rgba(255,0,255,.55));
    transform:skewX(-6deg);
  }
  .yr{ font-size:118px; }
  .forob{ margin-top:6px; font-size:52px; font-weight:700; transform:skewX(-6deg);
    color:#fff; -webkit-text-stroke:2px #ff00ff;
    text-shadow:3px 3px 0 #ff00ff, 0 0 18px #00ffff; }
  .forob b{ color:#ffe600; }

  .tag{ margin-top:22px; font-size:26px; color:#eafcff; max-width:820px;
    text-shadow:1px 1px 0 #000, 0 0 8px #ff00ff; }
  .chips{ margin-top:20px; display:flex; gap:12px; }
  .chip{ font-size:21px; font-weight:700; padding:6px 16px;
    border:3px outset #ffff00; background:#ff00ff; color:#ffff00; box-shadow:2px 2px 0 #000; }
  .chip.b{ background:#00ffff; color:#10002a; border-color:#ffffff; }

  /* furniture — pulled inside safe margins */
  .globe{ position:absolute; left:60px; top:44px; width:96px; z-index:4;
    filter:drop-shadow(0 0 14px #00ffff); }
  .newb{ position:absolute; right:70px; top:70px; width:120px; z-index:6; transform:rotate(8deg); }
  .baby{ position:absolute; right:78px; bottom:26px; width:150px; z-index:7;
    mix-blend-mode:screen; filter:drop-shadow(0 0 22px rgba(0,255,255,.35)); }
  .visitor{ position:absolute; left:60px; bottom:34px; z-index:6; text-align:left;
    color:#00ff66; font-size:20px; text-shadow:0 0 6px #00ff66; }
  .visitor .num{ font-family:"Courier New",monospace; background:#000; color:#00ff66;
    border:2px inset #00ff66; padding:2px 10px; letter-spacing:6px; display:inline-block; margin-top:4px; }
</style></head>
<body>
<div class="stage">
  <div class="shot2"><img src="__SHOT__"></div>
  <div class="shot"><img src="__SHOT__"></div>

  <img class="globe" src="__GLOBE__">
  <img class="newb" src="__NEW__">

  <div class="hero">
    <div class="kicker">★ An Obsidian Theme ★</div>
    <div class="wordwrap">
      <div class="flame"></div>
      <div>
        <div class="word">GeoCities <span class="yr">'98</span></div>
      </div>
      <div class="flame"></div>
    </div>
    <div class="forob">FOR <b>OBSIDIAN</b></div>
    <div class="tag">Table-layout soul for a Markdown app. Tiled starfields, Comic&nbsp;Sans, animated GIF dividers &amp; a dancing baby.</div>
    <div class="chips">
      <span class="chip">🌌 DARK</span>
      <span class="chip b">🌞 LIGHT</span>
      <span class="chip">🔥 UNHINGED</span>
    </div>
  </div>

  <img class="baby" src="__BABY__">
  <div class="visitor">You are visitor<br><span class="num">000001</span></div>
</div>
</body></html>
